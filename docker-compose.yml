version: '3.8'

services:
  umailserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/umailserver/umailserver:latest
    container_name: umailserver
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        CFG=/var/lib/umailserver/umailserver.yaml
        if [ -f /etc/umailserver/umailserver.yaml ]; then
          echo "compose: using operator-provided config from /etc/umailserver/umailserver.yaml"
          exec umailserver serve --config /etc/umailserver/umailserver.yaml
        fi
        if [ ! -f "$$CFG" ]; then
          echo "compose: generating first-start dev config at $$CFG (mount /etc/umailserver/umailserver.yaml to override)"
          SECRET=$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
          cat > "$$CFG" <<EOF
        # Generated by the compose first-start bootstrap (dev default).
        # Persists in the umail_data volume so the JWT secret stays stable.
        # Mount /etc/umailserver/umailserver.yaml to override; see
        # config/config.example.yaml for a full reference configuration.
        server:
          hostname: $${UMAILSERVER_SERVER_HOSTNAME:-mail.example.com}
          data_dir: /var/lib/umailserver
        database:
          path: /var/lib/umailserver/umailserver.db
        security:
          jwt_secret: $$SECRET
          max_login_attempts: 50
        http:
          enabled: true
          port: 8081
          bind: 0.0.0.0
        metrics:
          enabled: true
          port: 8080
          bind: 0.0.0.0
        smtp:
          inbound:
            enabled: true
            bind: 0.0.0.0
            port: 2525
            max_message_size: 26214400
          submission:
            enabled: true
            bind: 0.0.0.0
            port: 2587
            require_auth: true
        imap:
          enabled: true
          bind: 0.0.0.0
          port: 1143
        tls:
          cert_file: ""
          key_file: ""
          acme:
            enabled: false
        EOF
          chmod 600 "$$CFG"
        fi
        exec umailserver serve --config "$$CFG"
    ports:
      # Container runs as uid 1000 with cap_drop ALL: listeners bind
      # unprivileged (>=1024) ports inside the container; the published
      # host-standard ports keep working through the mappings.
      # SMTP (inbound mail)
      - "25:2525"
      # SMTP Submission (STARTTLS)
      - "587:2587"
      # IMAP (STARTTLS)
      - "143:1143"
      # HTTP API and Web UI
      - "443:8081"
      # Implicit-TLS SMTP/IMAP/POP3 and ManageSieve need certificates:
      # mount /etc/umailserver/umailserver.yaml (see
      # config/config.example.yaml) and add their mappings there.
    volumes:
      - umail_data:/var/lib/umailserver
      - ./config:/etc/umailserver:ro
    environment:
      - TZ=UTC
      - UMAILSERVER_SERVER_DATA_DIR=/var/lib/umailserver
      - UMAILSERVER_SERVER_HOSTNAME=${HOSTNAME:-mail.example.com}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - mailnet
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: umail-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - mailnet
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: umail-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - mailnet
    profiles:
      - monitoring

volumes:
  umail_data:
  prometheus_data:
  grafana_data:

networks:
  mailnet:
    driver: bridge
