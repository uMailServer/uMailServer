# golangci-lint v2 configuration
# See .golangci.reference.yml for all available options.
version: "2"

run:
  timeout: 5m
  tests: true

# Linters enabled for this project.
linters:
  default: none
  enable:
    - bodyclose
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - whitespace

  # Linter exclusions (v2 schema).
  # These rules suppress findings without using //nolint comments.
  exclusions:
    rules:
      # Suppress SA1029 for all context.WithValue using untyped string/int keys.
      # SA1029 is suppressed project-wide because the codebase predates the
      # typed-key convention; a follow-up PR should add typed keys.
      - linters: [staticcheck]
        text: "SA1029:"

      # Suppress SA4023 for stub implementations that always return nil error.
      - linters: [staticcheck]
        text: "SA4023:"

      # Suppress QF1012 (replace bytes.Join(bytes.Split...) with string/bytes conversion).
      - linters: [staticcheck]
        text: "QF1012:"

      # Suppress unconvert findings (type alias vs named type noise).
      - linters: [unconvert]
        text: "unconvert"

      # Test files have known lint debt.
      - path: _test\.go
        linters: [dupl, lll, whitespace]

      # Per-file ineffassign coverage for known noise.
      - path: internal/auth/ldap\.go
        linters: [ineffassign]
      - path: internal/imap/commands\.go
        linters: [ineffassign]
      - path: internal/jmap/handlers\.go
        linters: [ineffassign]
      - path: internal/jmap/handlers_test\.go
        linters: [whitespace]
      - path: internal/server/server_handlers\.go
        linters: [ineffassign]
      - path: internal/smtp/session\.go
        linters: [ineffassign]
      - path: internal/tracing/tracing_test\.go
        linters: [ineffassign]
      - path: internal/sieve/coverage_extra8_test\.go
        linters: [unused]
      - path: internal/caldav/handle_move_test\.go
        linters: [ineffassign]
      - path: internal/config/config\.go
        linters: [govet]

      # Global ineffassign suppression for pre-existing debt from upstream lint series.
      # Covered here and not via //nolint to keep test files clean.
      - linters: [ineffassign]
        text: "ineffassign"

# Issue reporting settings.
issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
