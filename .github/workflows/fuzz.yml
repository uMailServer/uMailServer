name: Fuzz

on:
  schedule:
    # Run 24h fuzzing corpus expansion every Monday at 3am UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzzing duration (hours)'
        required: false
        default: '24'
      package:
        description: 'Package to fuzz (default: all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ inputs.package || 'all' }})
    runs-on: ubuntu-latest
    # Fixed 25h budget in minutes (25h x 60); the inner step bounds itself at 1380.
    timeout-minutes: 1500
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
        env:
          GO_VERSION: '1.25'

      - name: Run fuzzing
        env:
          INPUT_HOURS: ${{ inputs.duration || '23' }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          set -uo pipefail
          # Discover real fuzz targets (pkg dir + func Fuzz*) so the list cannot go stale.
          # go test -fuzz accepts exactly one package and one matching target per run.
          mapfile -t TARGETS < <(grep -rEo --include='*_test.go' '^func Fuzz[A-Za-z0-9_]+' internal \
            | sed -E 's#^(.*)/[^/]+:func (Fuzz[A-Za-z0-9_]+)$#./\1 \2#' | sort -u)
          if [ -n "$INPUT_PACKAGE" ]; then
            FILTERED=()
            for t in "${TARGETS[@]}"; do
              case "$t" in "$INPUT_PACKAGE "*|"./$INPUT_PACKAGE "*) FILTERED+=("$t");; esac
            done
            TARGETS=("${FILTERED[@]}")
          fi
          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "no fuzz targets found"; exit 1
          fi
          HOURS="${INPUT_HOURS%%.*}"
          if ! [[ "$HOURS" =~ ^[0-9]+$ ]] || [ "$HOURS" -lt 1 ] || [ "$HOURS" -gt 23 ]; then HOURS=23; fi
          PER=$(( HOURS * 3600 / ${#TARGETS[@]} ))
          [ "$PER" -lt 10 ] && PER=10
          echo "Fuzzing ${#TARGETS[@]} targets, ${PER}s each"
          FAILED=0
          for t in "${TARGETS[@]}"; do
            pkg="${t% *}"; fn="${t#* }"
            echo "=== Fuzzing $pkg $fn ==="
            go test -run='^$' -fuzz="^${fn}\$" -fuzztime="${PER}s" "$pkg" || FAILED=1
          done
          exit $FAILED
        shell: bash
        timeout-minutes: 1400

      - name: Upload crashers
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: fuzz-crashers
          path: |
            **/crashers/
            **/suppressions/
          retention-days: 30
