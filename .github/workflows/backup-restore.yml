name: Backup and Restore

on:
  schedule:
    # Automated daily backup at 2 AM UTC
    - cron: '0 2 * * *'
    # Weekly restore test on Sunday at 4 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation mode'
        required: true
        default: 'backup'
        type: choice
        options:
          - backup
          - restore
          - verify
      backup_file:
        description: 'Backup file to restore (for restore mode)'
        required: false
        type: string
      retention_days:
        description: 'Backup retention in days'
        required: false
        type: number
        default: 30

permissions:
  contents: read
  actions: read
  packages: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  # Slack notifications are skipped when no webhook is configured.
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  backup:
    name: Create Backup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.mode == 'backup'
    outputs:
      backup_file: ${{ steps.create_backup.outputs.backup_file }}
      checksum: ${{ steps.create_backup.outputs.checksum }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}

      # embed.go embeds webmail/dist, web/admin/dist and web/account/dist,
      # which are git-ignored: the Go build fails without them.
      - name: Build web UIs
        run: |
          (cd webmail && npm ci --legacy-peer-deps && npm run build) &&
          (cd web/admin && npm ci --legacy-peer-deps && npm run build) &&
          (cd web/account && npm install --legacy-peer-deps && npm run build)

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -ldflags "-X main.Version=${{ github.sha }}" -o umailserver ./cmd/umailserver

      - name: Create backup source data
        run: |
          # A CI runner has no live server, so back up a small self-contained
          # data directory. The CLI requires a loadable config whose
          # server.data_dir is writable (an empty or HTML config fails
          # validation against /var/lib/umailserver).
          SRC=/tmp/umailserver-source
          mkdir -p "$SRC/data/config" "$SRC/data/messages/new"
          cat > "$SRC/data/config/umailserver.yaml" <<YAML
          server:
            hostname: backup-ci.local
            data_dir: $SRC/data
          YAML
          echo "test db content" > "$SRC/data/umailserver.db"
          echo "test message" > "$SRC/data/messages/new/1"

      - name: Create encrypted backup
        id: create_backup
        env:
          # Passed via env, not argv, so it is not visible in the process list.
          UMAILSERVER_BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD || 'default-password-change-me' }}
          VARS_DESTINATION: ${{ vars.BACKUP_DESTINATION }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          # The CLI backs up INTO a directory: it creates a timestamped
          # umailserver_backup_<TS>.tar.gz[.enc] inside it. Encryption is
          # enabled when a password is set; output is always gzip-compressed.
          OUT=/tmp/umailserver-backups
          mkdir -p "$OUT"
          ./umailserver backup \
            --config /tmp/umailserver-source/data/config/umailserver.yaml \
            "$OUT"

          BACKUP_FILE=$(ls -t "$OUT"/umailserver_backup_*.tar.gz* | grep -v '\.sha256$' | head -1)
          BACKUP_NAME=$(basename "$BACKUP_FILE")
          CHECKSUM=$(sha256sum "$BACKUP_FILE" | cut -d' ' -f1)
          echo "$CHECKSUM  $BACKUP_NAME" > "${BACKUP_FILE}.sha256"

          echo "backup_file=$BACKUP_FILE" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Backup created: $BACKUP_NAME"
          echo "Checksum: $CHECKSUM"

          # Copy to a configured local destination when it differs
          if [ -n "$VARS_DESTINATION" ] && [ "$VARS_DESTINATION" != "$OUT" ]; then
            mkdir -p "$VARS_DESTINATION"
            cp "$BACKUP_FILE" "${BACKUP_FILE}.sha256" "$VARS_DESTINATION/"
            echo "Copied backup to $VARS_DESTINATION"
          fi

          # Upload to S3 if configured
          if [ -n "$S3_BUCKET" ]; then
            P="s3://$S3_BUCKET/$(date +%Y/%m/%d)"
            aws s3 cp "$BACKUP_FILE" "$P/$BACKUP_NAME"
            aws s3 cp "${BACKUP_FILE}.sha256" "$P/$BACKUP_NAME.sha256"
            echo "Uploaded to S3"
          fi

      - name: Upload backup artifact
        # The restore job runs on a fresh runner, so hand the backup over as
        # an artifact (/tmp is not shared between jobs).
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: umailserver-backup
          path: /tmp/umailserver-backups/
          retention-days: ${{ github.event.inputs.retention_days || 30 }}
          if-no-files-found: error

      - name: Notify success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "uMailServer Backup Successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*uMailServer Backup Completed*\n• File: `${{ steps.create_backup.outputs.backup_file }}`\n• SHA256: `${{ steps.create_backup.outputs.checksum }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "uMailServer Backup Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*uMailServer Backup FAILED*\n• Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  restore-test:
    name: Restore Verification
    runs-on: ubuntu-latest
    needs: backup
    # A manual restore/verify run skips the backup job; "always()" lets this
    # job run anyway, but never after a failed backup.
    if: always() && needs.backup.result != 'failure' && needs.backup.result != 'cancelled' && (github.event_name == 'schedule' || github.event.inputs.mode == 'verify' || github.event.inputs.mode == 'restore')
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download backup artifact
        if: needs.backup.result == 'success'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: umailserver-backup
          path: /tmp/umailserver-backups

      - name: Find latest backup
        id: find_backup
        env:
          INPUT_BACKUP_FILE: ${{ github.event.inputs.backup_file }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          if [ -n "$INPUT_BACKUP_FILE" ]; then
            BACKUP_FILE="$INPUT_BACKUP_FILE"
          elif [ "${{ needs.backup.result }}" != "success" ] && [ -n "$S3_BUCKET" ]; then
            # Get latest backup from S3
            mkdir -p /tmp/umailserver-backups
            BACKUP_KEY=$(aws s3 ls "s3://$S3_BUCKET/" --recursive | grep -v '\.sha256$' | sort | tail -1 | awk '{print $4}')
            aws s3 cp "s3://$S3_BUCKET/${BACKUP_KEY}" /tmp/umailserver-backups/
            BACKUP_FILE="/tmp/umailserver-backups/$(basename "$BACKUP_KEY")"
          else
            BACKUP_FILE=$(ls -t /tmp/umailserver-backups/umailserver_backup_*.tar.gz* 2>/dev/null | grep -v '\.sha256$' | head -1 || true)
          fi

          if [ -z "$BACKUP_FILE" ] || [ ! -f "$BACKUP_FILE" ]; then
            echo "No backup found"
            exit 1
          fi

          echo "backup_file=$BACKUP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using backup: $BACKUP_FILE"

      - name: Build web UIs
        run: |
          (cd webmail && npm ci --legacy-peer-deps && npm run build) &&
          (cd web/admin && npm ci --legacy-peer-deps && npm run build) &&
          (cd web/account && npm install --legacy-peer-deps && npm run build)

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -ldflags "-X main.Version=test" -o umailserver-test ./cmd/umailserver

      - name: Create test environment
        run: |
          # restore extracts into <data_dir>/../restore_temp
          mkdir -p /tmp/umailserver-test/data/config
          cat > /tmp/umailserver-test/data/config/umailserver.yaml << 'YAML'
          server:
            hostname: test-backup.local
            data_dir: /tmp/umailserver-test/data
          YAML

      - name: Verify backup integrity
        env:
          BACKUP_FILE: ${{ steps.find_backup.outputs.backup_file }}
        run: |
          CHECKSUM_FILE="${BACKUP_FILE}.sha256"
          if [ -f "$CHECKSUM_FILE" ]; then
            CALCULATED=$(sha256sum "$BACKUP_FILE" | cut -d' ' -f1)
            STORED=$(cut -d' ' -f1 "$CHECKSUM_FILE")
            if [ "$CALCULATED" != "$STORED" ]; then
              echo "Checksum mismatch!"
              echo "Expected: $STORED"
              echo "Got: $CALCULATED"
              exit 1
            fi
            echo "Checksum verified"
          fi

      - name: Restore backup
        env:
          UMAILSERVER_BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD || 'default-password-change-me' }}
          BACKUP_FILE: ${{ steps.find_backup.outputs.backup_file }}
        run: |
          ./umailserver-test restore \
            --config /tmp/umailserver-test/data/config/umailserver.yaml \
            "$BACKUP_FILE"

      - name: Verify restored contents
        run: |
          RESTORE_DIR="/tmp/umailserver-test/restore_temp"
          echo "=== Checking restored files ==="

          if [ -f "$RESTORE_DIR/manifest.json" ]; then
            echo "manifest.json present"
            python3 -c "import json; d=json.load(open('$RESTORE_DIR/manifest.json')); print('Version:', d.get('version'), 'Timestamp:', d.get('timestamp'))"
          else
            echo "manifest.json missing"; exit 1
          fi

          if [ -d "$RESTORE_DIR/config" ]; then
            echo "config/ directory present"
          else
            echo "config/ directory missing"; exit 1
          fi

          if [ -f "$RESTORE_DIR/database/umailserver.db" ]; then
            echo "database/umailserver.db present"
          else
            echo "database/umailserver.db missing"; exit 1
          fi

          echo "=== All restore checks passed ==="

      - name: Notify restore success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "uMailServer Restore Verified",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*uMailServer Restore Test Passed*\n• Backup: `${{ steps.find_backup.outputs.backup_file }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify restore failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "uMailServer Restore Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*uMailServer Restore Test FAILED*\n• Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/umailserver-test /tmp/umailserver-backups
          echo "Cleanup complete"
