# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options
#
# Preconditions (now satisfied on uMailServer/uMailServer):
#   - Branch protection on `main` requires Lint, Test, Build (strict=true, admins enforced).
#   - Repo-level auto-merge is enabled (gh repo edit uMailServer/uMailServer --enable-auto-merge).
# Auto-merge is therefore safe to grant for non-major updates below.
version: 2

# Shared defaults — applied to every ecosystem below.
# `groups` collapses dozens of transitive bumps into one reviewable PR.
# `open-pull-requests-limit` is raised so security batches aren't silently dropped.
# `rebase-strategy: auto` keeps stacked PRs from going stale.
x-base: &base
  open-pull-requests-limit: 20
  rebase-strategy: auto
  commit-message:
    prefix: "chore(deps)"
    include: "scope"
  labels:
    - "dependencies"

# Major-version bumps are NEVER auto-merged — they require manual review.
# We model that by adding `ignore.update-types: ["version-update:semver-major"]`
# at the ecosystem level on top of the YAML anchor.
x-ignore-majors: &ignore_majors
  ignore:
    dependency-name: "*"
    update-types: ["version-update:semver-major"]

# Go modules — runtime is the production mail server; security bumps are P0.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    <<: [*base, *ignore_majors]
    auto-merge: true
    # Group non-major bumps; majors stay individual for review.
    groups:
      gomod-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      gomod-security:
        applies-to: security-updates
        patterns: ["*"]

# npm — webmail (production frontend)
  - package-ecosystem: "npm"
    directory: "/webmail"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    <<: [*base, *ignore_majors]
    auto-merge: true
    groups:
      npm-runtime:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
        exclude-patterns: ["@types/*", "*-loader", "*-plugin"]
      npm-types:
        applies-to: version-updates
        patterns: ["@types/*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

# npm — web/admin (admin SPA)
  - package-ecosystem: "npm"
    directory: "/web/admin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    <<: [*base, *ignore_majors]
    auto-merge: true
    groups:
      npm-runtime:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
        exclude-patterns: ["@types/*", "*-loader", "*-plugin"]
      npm-types:
        applies-to: version-updates
        patterns: ["@types/*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

# npm — web/account (account portal)
  - package-ecosystem: "npm"
    directory: "/web/account"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    <<: [*base, *ignore_majors]
    auto-merge: true
    groups:
      npm-runtime:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
        exclude-patterns: ["@types/*", "*-loader", "*-plugin"]
      npm-types:
        applies-to: version-updates
        patterns: ["@types/*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

# Docker — top-level Dockerfile + docker-compose
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    <<: [*base, *ignore_majors]
    auto-merge: true

# GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    <<: [*base, *ignore_majors]
    auto-merge: true
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
