apiVersion: v1
kind: Secret
metadata:
  name: {{ include "umailserver.fullname" . }}
  labels:
    {{- include "umailserver.labels" . | nindent 4 }}
type: Opaque
data:
  # The config may hold credentials (LDAP, relay, alert SMTP), so it is a
  # Secret rather than a ConfigMap.
  umailserver.yaml: {{ include "umailserver.config" . | b64enc | quote }}
  {{- if not .Values.existingSecret }}
  {{- $jwt := .Values.jwtSecret }}
  {{- if not $jwt }}
  {{- /* Keep the generated secret across upgrades: a new one would log every user out. */}}
  {{- $old := lookup "v1" "Secret" .Release.Namespace (include "umailserver.fullname" .) }}
  {{- if and $old $old.data (hasKey $old.data "jwt-secret") }}
  {{- $jwt = index $old.data "jwt-secret" | b64dec }}
  {{- else }}
  {{- $jwt = randAlphaNum 64 }}
  {{- end }}
  {{- end }}
  jwt-secret: {{ $jwt | b64enc | quote }}
  {{- end }}
