apiVersion: v1
kind: Service
metadata:
  name: {{ include "umailserver.fullname" . }}
  labels:
    {{- include "umailserver.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (ne .Values.service.type "ClusterIP") .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  selector:
    {{- include "umailserver.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $name, $p := .Values.ports }}
    {{- if $p.enabled }}
    - name: {{ $name }}
      port: {{ $p.port }}
      targetPort: {{ $name }}
      protocol: TCP
    {{- end }}
    {{- end }}
